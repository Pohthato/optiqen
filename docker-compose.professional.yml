# Professional Netoval Deployment Configuration

version: '3.8'

services:
  # Redis for caching and job queuing
  redis:
    image: redis:7-alpine
    container_name: netoval-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netoval-network

  # PostgreSQL for persistent storage
  db:
    image: postgres:15-alpine
    container_name: netoval-db
    environment:
      POSTGRES_USER: netoval
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: netoval
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netoval"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netoval-network

  # Main Flask application
  app:
    build:
      context: .
      dockerfile: Dockerfile.professional
    container_name: netoval-app
    environment:
      FLASK_ENV: production
      FLASK_APP: app_professional.py
      DATABASE_URL: postgresql://netoval:${DB_PASSWORD:-changeme}@db:5432/netoval
      REDIS_URL: redis://redis:6379/0
      USE_CUDA: ${USE_CUDA:-0}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      MAX_VIDEO_LENGTH_SEC: 300
      MAX_VIDEO_SIZE_MB: 512
    volumes:
      - ./uploads:/app/uploads
      - ./models:/app/models
      - ./logs:/app/logs
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    # GPU support (requires docker-compose v1.28.0+)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - netoval-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx reverse proxy and load balancer
  nginx:
    image: nginx:alpine
    container_name: netoval-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    networks:
      - netoval-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery worker for async tasks
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.professional
    container_name: netoval-celery
    command: celery -A tasks worker --loglevel=info
    environment:
      FLASK_ENV: production
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATABASE_URL: postgresql://netoval:${DB_PASSWORD:-changeme}@db:5432/netoval
      USE_CUDA: ${USE_CUDA:-0}
    volumes:
      - ./uploads:/app/uploads
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      - redis
      - db
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - netoval-network

networks:
  netoval-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
